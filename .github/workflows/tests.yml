name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Versi PHP disamakan dengan yang dipakai saat rilis, supaya kalau ada
      # yang tidak cocok, ketahuannya di sini — bukan di server.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_sqlite, zip, intl
          coverage: none

      - name: Pasang dependensi
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan test
        run: php artisan test
