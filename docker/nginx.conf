daemon off;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Unduhan CSV di sini dialirkan, bukan disusun di memori. Buffering nginx
    # akan membatalkan manfaat itu, jadi dimatikan untuk respons proxy_pass —
    # fastcgi_buffering diatur per-lokasi di bawah.
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;
    gzip_min_length 1024;

    server {
        # Diisi envsubst saat kontainer mulai; Render menentukan portnya
        # lewat variabel PORT.
        listen ${PORT};
        server_name _;

        root /var/www/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Aset ber-hash dari Vite: namanya berubah tiap build, jadi aman
        # disimpan lama di browser.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Ekspor CSV bisa berjalan lama dan besar. Tanpa ini nginx menahan
            # seluruh isinya dulu sebelum mengirim, yang justru menghabiskan
            # memori yang berusaha dihemat oleh streaming.
            fastcgi_buffering off;
            fastcgi_read_timeout 120;
        }

        # File tersembunyi tidak pernah boleh terbaca, kecuali well-known
        # untuk verifikasi sertifikat.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
