; Batas yang disamakan dengan shared hosting, supaya masalah yang muncul di
; cPanel nanti sudah kelihatan lebih dulu di sini — bukan kejutan pas rilis.
memory_limit = 256M
max_execution_time = 120

upload_max_filesize = 12M
post_max_size = 14M

; Impor berkas besar dibaca lewat generator, jadi batas ini jarang tersentuh.
; Kalau tersentuh, itu pertanda ada yang menumpuk di memori — bukan alasan
; untuk menaikkan angkanya.
max_input_vars = 3000

expose_php = Off

; OPcache. Kode di kontainer tidak pernah berubah setelah dibangun, jadi
; pengecekan timestamp cuma buang-buang syscall.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16

; Disamakan dengan APP_TIMEZONE. Laravel mengatur zona waktunya sendiri, ini
; untuk fungsi date() PHP yang di luar jangkauan Laravel.
date.timezone = Asia/Jakarta
