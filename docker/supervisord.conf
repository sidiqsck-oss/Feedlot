; Satu kontainer menjalankan tiga proses.
;
; Di cPanel, queue dan scheduler dijalankan cron. Render tidak punya cron di
; paket gratis, jadi keduanya ikut di sini — perilakunya sama, cuma yang
; membangunkan berbeda.

[supervisord]
; Supervisor sendiri jalan sebagai root supaya bisa mengikat port dan
; menurunkan hak akses anak-anaknya. Ditulis eksplisit supaya tidak jadi
; peringatan di log tiap kali kontainer mulai.
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Impor besar dilempar ke antrean supaya tidak menabrak batas waktu HTTP.
; --max-time bikin pekerjanya berhenti lalu dijalankan ulang supervisor,
; sehingga kebocoran memori tidak menumpuk seharian.
; user=www-data penting, bukan kosmetik: pekerja antrean menulis log dan berkas
; sementara. Kalau jalan sebagai root, berkasnya jadi milik root dan php-fpm
; (yang jalan sebagai www-data) tidak bisa menulisinya lagi.
[program:queue]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/artisan schedule:work
user=www-data
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
